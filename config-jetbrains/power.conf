; ============================================================================
; - power.conf - 大数运算拦截规则
; ----------------------------------------------------------------------------
; 用于 power 插件，hook java.math.BigInteger.modPow 调用。
;
; 格式：
;   [Section]
;   EQUAL,<sig>,<e>,<n>-><expected_result>
;
; 含义：
;   当 BigInteger.modPow(sig, e, n) 返回 expected_result 时，
;   替换为新的 result 值。
;
; 注意：
;   此处使用 ckey.run 提供的 RSA 公钥参数。
;   实际部署时需要从 https://ckey.run 获取最新的 power.conf。
; ============================================================================

[Result]
; 占位规则：实际使用时替换为 ckey.run 提供的真实规则
EQUAL,0,65537,12345678901234567890->0