# =============================================================================
# .github/workflows/release-please.yml - 自动发版工作流
# ----------------------------------------------------------------------------
# 使用 googleapis/release-please-action@v4 自动管理发版流程：
#
# 工作流程：
#   1. 监控 Conventional Commits（feat:, fix:, chore:, etc.）
#   2. 自动创建/更新 "Release PR"，包含：
#      - 版本号自动 bump
#      - CHANGELOG.md 自动生成
#   3. 当 Release PR 被合并时：
#      - 自动创建 GitHub Release
#      - 上传所有构建产物（jar 文件、配置、脚本、文档）
#
# 配置说明：
#   - 所有 release-please 配置在仓库根部的 release-please-config.json 中
#   - artifacts 配置定义了要上传到 Release 的文件
#
# 用法：
#   - PR 标题或 commit 消息前缀：
#     - feat: 新功能 → minor 版本
#     - fix: bug 修复 → patch 版本
#     - feat!: 重大变更 → major 版本
#     - chore: 杂项 → 不发版
#   - 合并 Release PR 即触发正式发版
# =============================================================================
name: Release Please

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
              ${{ runner.os }}-gradle-

      - name: Build all jars (for artifact upload)
        run: |
          chmod +x gradlew
          ./gradlew clean build :ja-netfilter:fatJar --no-daemon --stacktrace

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          # 主 agent jar（fat jar）
          cp ja-netfilter/build/libs/ja-netfilter-2.2.0-all.jar release-artifacts/ja-netfilter.jar
          # 7 个插件
          for plugin in dns env hideme native power privacy url; do
            if [ -f "plugins/${plugin}/build/libs/${plugin}-2.2.0.jar" ]; then
              cp "plugins/${plugin}/build/libs/${plugin}-2.2.0.jar" "release-artifacts/${plugin}.jar"
            fi
          done
          # 配置文件
          cp -r config-jetbrains release-artifacts/ || true
          # vmoptions 模板
          cp -r vmoptions release-artifacts/ || true
          # 文档
          cp README.md release-artifacts/ || true
          # 激活码
          cp code.txt release-artifacts/ || true
          # 脚本
          cp -r scripts release-artifacts/ || true
          # 显示内容
          echo "=== Release Artifacts ==="
          ls -la release-artifacts/

      # -----------------------------------------------------------------------------
      # 运行 release-please 创建/更新 Release PR
      # -----------------------------------------------------------------------------
      # 使用 release-please-config.json 中的所有配置
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ja-netfilter-release-artifacts
          path: release-artifacts/
          retention-days: 30