# =============================================================================
# .github/workflows/ci.yml - CI 自动编译工作流
# ----------------------------------------------------------------------------
# 触发条件：
#   - push 到 main 或 develop 分支
#   - 对 main 或 develop 分支的 PR
# 功能：
#   - 在 Ubuntu 和 Windows 上编译项目
#   - 运行所有模块的 Gradle 构建
#   - 上传构建产物为 artifact
# =============================================================================
name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# 防止同时运行多个 CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认权限
permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Linux 构建
  # ==========================================================================
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
              ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean build --no-daemon --stacktrace

      - name: Build fat jar
        run: |
          ./gradlew :ja-netfilter:fatJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ja-netfilter-linux
          path: |
            ja-netfilter/build/libs/ja-netfilter-*.jar
            plugins/*/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # Windows 构建
  # ==========================================================================
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
              ${{ runner.os }}-gradle-

      - name: Build with Gradle
        shell: cmd
        run: |
          gradlew.bat clean build --no-daemon --stacktrace

      - name: Build fat jar
        shell: cmd
        run: |
          gradlew.bat :ja-netfilter:fatJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ja-netfilter-windows
          path: |
            ja-netfilter\build\libs\ja-netfilter-*.jar
            plugins\*\build\libs\*-*.jar
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # macOS 构建
  # ==========================================================================
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
              ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean build --no-daemon --stacktrace

      - name: Build fat jar
        run: |
          ./gradlew :ja-netfilter:fatJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ja-netfilter-macos
          path: |
            ja-netfilter/build/libs/ja-netfilter-*.jar
            plugins/*/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # 验证构建产物
  # ==========================================================================
  verify:
    name: Verify Artifacts
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Build Artifacts ==="
          ls -lh artifacts/*/ 2>&1 || true
          echo ""
          echo "=== Total size ==="
          du -sh artifacts/ 2>&1 || true

      - name: Verify JAR structure
        run: |
          if [ -f artifacts/ja-netfilter-linux/ja-netfilter-2.2.0-all.jar ]; then
            echo "=== JAR Manifest ==="
            unzip -p artifacts/ja-netfilter-linux/ja-netfilter-2.2.0-all.jar META-INF/MANIFEST.MF
            echo ""
            echo "=== JAR size ==="
            ls -lh artifacts/ja-netfilter-linux/ja-netfilter-2.2.0-all.jar
          else
            echo "ERROR: Main JAR not found"
            exit 1
          fi